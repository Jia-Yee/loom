<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loom — AutoML 控制台</title>
<style>
  :root {
    --bg: #f0f0f5; --surface: #ffffff; --text: #1d1d1f; --text-light: #86868b;
    --border: #d2d2d7; --accent: #4a7c59; --accent-hover: #3a6349;
    --danger: #ff3b30; --success: #34c759; --warning: #ff9500; --info: #007aff;
    --radius: 10px; --shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .topbar {
    height: 48px; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 20px; gap: 16px; flex-shrink: 0;
  }
  .topbar h1 { font-size: 1.05rem; font-weight: 600; }
  .topbar .spacer { flex: 1; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-light); }
  .status-dot.running { background: var(--info); animation: pulse 1s infinite; }
  .status-dot.success { background: var(--success); }
  .status-dot.error { background: var(--danger); }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .layout { display: flex; flex: 1; overflow: hidden; }
  .sidebar {
    width: 320px; background: var(--surface); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 16px; flex-shrink: 0;
  }
  .sidebar h2 { font-size: 0.8rem; color: var(--text-light); text-transform: uppercase; margin: 16px 0 8px; letter-spacing: 0.5px; }
  .sidebar h2:first-child { margin-top: 0; }
  .sidebar label { display: block; font-size: 0.8rem; color: var(--text-light); margin-bottom: 4px; }
  .sidebar select, .sidebar input[type="number"], .sidebar input[type="text"], .sidebar input[type="password"] {
    width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem; background: var(--surface);
  }
  .sidebar .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .sidebar .row > div { flex: 1; }
  .checkbox-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .checkbox-row label { margin: 0; font-size: 0.85rem; color: var(--text); }
  .btn-run {
    width: 100%; padding: 10px; background: var(--accent); color: white; border: none;
    border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 12px;
  }
  .btn-run:hover { background: var(--accent-hover); }
  .btn-run:disabled { background: var(--text-light); cursor: not-allowed; }
  .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .canvas-area { flex: 1; position: relative; overflow: auto; background: var(--bg); }
  .canvas-toolbar { padding: 8px 12px; display: flex; gap: 8px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .canvas-toolbar button { padding: 4px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); cursor: pointer; font-size: 0.8rem; }
  .canvas-toolbar button:hover { background: #f0f0f5; }
  .canvas-inner { position: relative; min-width: 100%; min-height: 100%; }
  .node {
    position: absolute; width: 200px; background: var(--surface); border: 2px solid var(--border);
    border-radius: 8px; box-shadow: var(--shadow); cursor: move; user-select: none; transition: border-color 0.2s;
  }
  .node.dragging { opacity: 0.8; z-index: 100; }
  .node.status-success { border-color: var(--success); }
  .node.status-running { border-color: var(--info); animation: nodePulse 1.5s infinite; }
  .node.status-failed { border-color: var(--danger); }
  .node.status-skipped { border-color: var(--text-light); border-style: dashed; opacity: 0.6; }
  @keyframes nodePulse { 50% { box-shadow: 0 0 12px var(--info); } }
  .node-header { padding: 6px 10px; font-size: 0.75rem; font-weight: 600; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .node-body { padding: 8px 10px; font-size: 0.75rem; line-height: 1.5; }
  .node-body .field { display: flex; justify-content: space-between; margin-bottom: 2px; }
  .node-body .field .k { color: var(--text-light); }
  .node-body .field .v { font-weight: 500; font-variant-numeric: tabular-nums; }
  .node-body .tag-list { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 4px; }
  .node-body .tag { padding: 1px 6px; background: #f0f0f5; border-radius: 4px; font-size: 0.7rem; }
  .node-body .raw-text { white-space: pre-wrap; max-height: 120px; overflow-y: auto; color: var(--text-light); }
  .node-body .skipped-text { color: var(--text-light); font-style: italic; }
  .node-badge { font-size: 0.65rem; padding: 1px 6px; border-radius: 4px; color: white; }
  .badge-success { background: var(--success); }
  .badge-running { background: var(--info); }
  .badge-failed { background: var(--danger); }
  .badge-skipped { background: var(--text-light); }
  .edge-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .empty-state { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: var(--text-light); }
  .empty-state .icon { font-size: 3rem; margin-bottom: 8px; }
  .log-panel { height: 180px; background: #1e1e1e; color: #e0e0e0; padding: 8px 12px; overflow-y: auto; font-family: "SF Mono", "Fira Code", monospace; font-size: 0.78rem; line-height: 1.6; flex-shrink: 0; }
  .log-line { white-space: pre-wrap; word-break: break-all; }
  .log-line.error { color: #ff6b6b; }
  .log-line.success { color: #51cf66; }
  .log-line.warning { color: #ffd43b; }
  .log-line.step { color: #74c0fc; font-weight: 600; }
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--surface); border-radius: 12px; padding: 24px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
  .modal h2 { margin-bottom: 16px; }
  .modal table { width: 100%; border-collapse: collapse; }
  .modal th, .modal td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
  .modal .close-btn { margin-top: 16px; padding: 8px 20px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; }
  .csv-preview { margin-top: 8px; max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; }
  .csv-preview table { width: 100%; font-size: 0.75rem; }
  .csv-preview th, .csv-preview td { padding: 4px 6px; border: 1px solid var(--border); }
  .data-source-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .data-source-tabs button { flex: 1; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); cursor: pointer; font-size: 0.8rem; }
  .data-source-tabs button.active { background: var(--accent); color: white; border-color: var(--accent); }
  .llm-status { padding: 6px 8px; border-radius: 6px; font-size: 0.75rem; margin-bottom: 8px; }
  .llm-status.configured { background: #e8f5e9; color: #2e7d32; }
  .llm-status.not-configured { background: #fff3e0; color: #e65100; }
  .step-progress { padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 0.8rem; display: none; }
  .step-progress.show { display: block; }
  .step-progress .step-item { display: inline-flex; align-items: center; gap: 4px; margin-right: 16px; }
  .step-progress .step-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
  .step-progress .step-dot.running { background: var(--info); animation: pulse 1s infinite; }
  .step-progress .step-dot.success { background: var(--success); }
  .step-progress .step-dot.failed { background: var(--danger); }
  .step-progress .step-dot.skipped { background: var(--text-light); }
</style>
</head>
<body>

<div class="topbar">
  <h1>Loom AutoML</h1>
  <div class="spacer"></div>
  <span class="status-dot" id="statusDot"></span>
  <span id="statusText" style="font-size:0.85rem;">就绪</span>
  <button onclick="showHistory()" style="padding:4px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);cursor:pointer;font-size:0.8rem;">历史</button>
</div>

<div class="step-progress" id="stepProgress"></div>

<div class="layout">
  <!-- 左侧配置 -->
  <div class="sidebar">
    <h2>数据源</h2>
    <div class="data-source-tabs">
      <button id="tabPreset" class="active" onclick="switchTab('preset')">内置数据集</button>
      <button id="tabCsv" onclick="switchTab('csv')">上传 CSV</button>
    </div>

    <div id="presetPanel">
      <label>选择数据集</label>
      <select id="datasetSelect"></select>
    </div>

    <div id="csvPanel" style="display:none;">
      <label>上传 CSV 文件</label>
      <input type="file" id="csvFile" accept=".csv" style="font-size:0.8rem;margin-bottom:8px;" />
      <div id="csvResult"></div>
      <div id="csvConfig" style="display:none;">
        <label>数据集名称</label>
        <input type="text" id="csvName" placeholder="my_data" style="margin-bottom:8px;" />
        <label>目标列</label>
        <select id="csvTargetCol" style="margin-bottom:8px;"></select>
        <label>任务类型</label>
        <select id="csvTaskType" style="margin-bottom:8px;">
          <option value="regression">回归</option>
          <option value="classification">分类</option>
        </select>
      </div>
    </div>

    <h2>模型</h2>
    <div id="modelCheckboxes"></div>

    <h2>运行参数</h2>
    <div class="row">
      <div><label>测试集比例</label><input type="number" id="testSize" value="0.2" step="0.05" min="0.05" max="0.5" /></div>
      <div><label>随机种子</label><input type="number" id="seed" value="42" /></div>
    </div>

    <div class="checkbox-row">
      <input type="checkbox" id="selectBest" />
      <label for="selectBest">自动选优（生成对比节点）</label>
    </div>

    <div class="checkbox-row">
      <input type="checkbox" id="searchEnabled" />
      <label for="searchEnabled">超参搜索</label>
    </div>
    <div id="searchParams" style="display:none;margin-left:20px;margin-bottom:8px;">
      <div class="row">
        <div><label>迭代次数</label><input type="number" id="nIter" value="10" /></div>
        <div><label>交叉验证折数</label><input type="number" id="cv" value="5" /></div>
      </div>
    </div>

    <label>LLM 解读范围</label>
    <select id="llmPostScope" style="margin-bottom:8px;">
      <option value="all">全部模型</option>
      <option value="best">仅最优模型</option>
    </select>

    <h2>LLM 配置</h2>
    <div class="llm-status" id="llmStatus"></div>
    <label>Provider</label>
    <select id="llmProvider" style="margin-bottom:8px;">
      <option value="">不使用 LLM</option>
      <option value="deepseek">DeepSeek</option>
      <option value="ollama">Ollama（本地）</option>
    </select>
    <label>API Key（DeepSeek 需要，Ollama 随意填）</label>
    <input type="password" id="llmApiKey" placeholder="sk-..." style="margin-bottom:8px;" />
    <label>Base URL（可选，覆盖默认）</label>
    <input type="text" id="llmBaseUrl" placeholder="自动" style="margin-bottom:8px;" />
    <label>模型名</label>
    <input type="text" id="llmModel" placeholder="如 qwen3.5:4b" style="margin-bottom:8px;" />
    <label>超时（秒）</label>
    <input type="number" id="llmTimeout" value="60" style="margin-bottom:8px;" />

    <button class="btn-run" id="runBtn" onclick="runPipeline()">▶ 运行流水线</button>
  </div>

  <!-- 右侧画布 + 日志 -->
  <div class="content">
    <div class="canvas-area" id="canvas">
      <div class="canvas-toolbar">
        <button onclick="resetLayout()">重置布局</button>
        <button onclick="downloadNodes()">下载 nodes.json</button>
        <button onclick="downloadResult()">下载完整结果</button>
      </div>
      <div class="empty-state" id="emptyState">
        <div class="icon">🌀</div>
        <div>选择数据源和模型，点击「运行流水线」</div>
      </div>
      <div class="canvas-inner" id="canvasInner" style="display:none;">
        <svg class="edge-layer" id="edgeLayer"></svg>
      </div>
    </div>
    <div class="log-panel" id="logPanel">
      <div class="log-line">Loom 控制台已就绪。配置参数后点击「运行流水线」。</div>
    </div>
  </div>
</div>

<!-- 历史弹窗 -->
<div class="modal-overlay" id="historyModal">
  <div class="modal">
    <h2>历史运行</h2>
    <table>
      <thead><tr><th>Run ID</th><th>数据集</th><th>最优模型</th><th>时间</th></tr></thead>
      <tbody id="historyBody"></tbody>
    </table>
    <button class="close-btn" onclick="closeHistory()">关闭</button>
  </div>
</div>

<script>
let nodeData = { nodes: [], edges: [] };
let initialPositions = {};
let lastResult = null;
let currentTab = 'preset';
let csvFilePath = null;

// ── 初始化 ──────────────────────────────────────────
async function init() {
  await loadModels();
  await loadDatasets();
  await loadLLMConfig();
  document.getElementById('searchEnabled').onchange = function() {
    document.getElementById('searchParams').style.display = this.checked ? 'block' : 'none';
  };
}

async function loadModels() {
  const res = await fetch('/api/models');
  const data = await res.json();
  const container = document.getElementById('modelCheckboxes');
  container.innerHTML = '';
  data.models.forEach(m => {
    const lbl = document.createElement('label');
    lbl.style.cssText = 'display:flex;align-items:center;gap:6px;font-size:0.85rem;color:var(--text);margin-bottom:4px;cursor:pointer;';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.value = m; cb.id = `model_${m}`;
    if (m === 'linear_regression') cb.checked = true;
    lbl.appendChild(cb); lbl.appendChild(document.createTextNode(m));
    container.appendChild(lbl);
  });
}

async function loadDatasets() {
  const res = await fetch('/api/datasets');
  const data = await res.json();
  const sel = document.getElementById('datasetSelect');
  sel.innerHTML = '';
  data.datasets.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d; opt.textContent = d;
    sel.appendChild(opt);
  });
}

async function loadLLMConfig() {
  const res = await fetch('/api/config');
  const data = await res.json();
  updateLLMStatus(data);
}

function updateLLMStatus(cfg) {
  const el = document.getElementById('llmStatus');
  if (cfg.provider) {
    el.className = 'llm-status configured';
    el.textContent = `✓ ${cfg.provider} 已配置 (模型: ${cfg.model || '默认'})`;
  } else {
    el.className = 'llm-status not-configured';
    el.textContent = '⚠ 未配置 LLM（训练评估正常，LLM 分析将跳过）';
  }
}

// ── 数据源切换 ──────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabPreset').classList.toggle('active', tab === 'preset');
  document.getElementById('tabCsv').classList.toggle('active', tab === 'csv');
  document.getElementById('presetPanel').style.display = tab === 'preset' ? 'block' : 'none';
  document.getElementById('csvPanel').style.display = tab === 'csv' ? 'block' : 'none';
}

// ── CSV 上传 ────────────────────────────────────────
document.getElementById('csvFile').addEventListener('change', async function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append('file', file);
  const res = await fetch('/api/upload_csv', { method: 'POST', body: formData });
  const data = await res.json();
  if (data.status === 'success') {
    csvFilePath = data.filepath;
    document.getElementById('csvResult').innerHTML = `<div style="font-size:0.8rem;color:var(--success);">✓ ${data.n_rows} 行, ${data.columns.length} 列</div>`;
    document.getElementById('csvConfig').style.display = 'block';
    const sel = document.getElementById('csvTargetCol');
    sel.innerHTML = '';
    data.columns.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      sel.appendChild(opt);
    });
    // 预览
    let previewHTML = '<div class="csv-preview"><table><thead><tr>';
    data.columns.forEach(c => previewHTML += `<th>${escapeHTML(c)}</th>`);
    previewHTML += '</tr></thead><tbody>';
    data.preview.forEach(row => {
      previewHTML += '<tr>';
      data.columns.forEach(c => previewHTML += `<td>${escapeHTML(String(row[c]))}</td>`);
      previewHTML += '</tr>';
    });
    previewHTML += '</tbody></table></div>';
    document.getElementById('csvResult').innerHTML += previewHTML;
  } else {
    document.getElementById('csvResult').innerHTML = `<div style="color:var(--danger);">${data.message}</div>`;
  }
});

// ── 运行流水线（SSE 流式）────────────────────────────
async function runPipeline() {
  const models = Array.from(document.querySelectorAll('#modelCheckboxes input:checked')).map(cb => cb.value);
  if (models.length === 0) { addLog('请至少选择一个模型', 'error'); return; }

  const payload = {
    model_names: models,
    test_size: parseFloat(document.getElementById('testSize').value),
    seed: parseInt(document.getElementById('seed').value),
    select_best: document.getElementById('selectBest').checked,
    llm_post_scope: document.getElementById('llmPostScope').value,
    search: document.getElementById('searchEnabled').checked,
    n_iter: parseInt(document.getElementById('nIter').value) || 10,
    cv: parseInt(document.getElementById('cv').value) || 5,
    llm_provider: document.getElementById('llmProvider').value,
    llm_api_key: document.getElementById('llmApiKey').value,
    llm_base_url: document.getElementById('llmBaseUrl').value,
    llm_model: document.getElementById('llmModel').value,
    llm_timeout: document.getElementById('llmTimeout').value,
  };

  // 数据源
  if (currentTab === 'preset') {
    payload.dataset_name = document.getElementById('datasetSelect').value;
  } else {
    if (!csvFilePath) { addLog('请先上传 CSV 文件', 'error'); return; }
    payload.csv_config = {
      name: document.getElementById('csvName').value || 'csv_data',
      filepath: csvFilePath,
      target_column: document.getElementById('csvTargetCol').value,
      task_type: document.getElementById('csvTaskType').value,
    };
  }

  document.getElementById('runBtn').disabled = true;
  document.getElementById('runBtn').textContent = '运行中...';
  setStatus('running', '运行中');
  clearLog();
  clearCanvas();
  showStepProgress(['加载数据', 'LLM 分析', '训练', '评估', 'LLM 解读']);

  try {
    const res = await fetch('/api/run_stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const evt = JSON.parse(line.slice(6));
          handleSSEEvent(evt);
        }
      }
    }
  } catch (e) {
    addLog(`请求失败: ${e.message}`, 'error');
    setStatus('error', '错误');
  }

  document.getElementById('runBtn').disabled = false;
  document.getElementById('runBtn').textContent = '▶ 运行流水线';
}

function handleSSEEvent(evt) {
  if (evt.type === 'step') {
    addLog(`[${evt.step}] ${evt.status}: ${evt.message}`, 'step');
    updateStepProgress(evt.step, evt.status);
  } else if (evt.type === 'done') {
    lastResult = evt;
    nodeData = { nodes: evt.nodes, edges: evt.edges, run_id: evt.run_id };
    initialPositions = {};
    evt.nodes.forEach(n => { initialPositions[n.id] = { ...n.position }; });
    renderCanvas();
    setStatus('success', '完成');
    addLog(`\n评估指标:`, 'success');
    for (const [model, m] of Object.entries(evt.metrics)) {
      const s = Object.entries(m).map(([k,v]) => `${k}=${typeof v === 'number' ? v.toFixed(4) : v}`).join('  ');
      addLog(`  ${model}: ${s}`);
    }
    if (evt.best_model) addLog(`\n⭐ 最优模型: ${evt.best_model}`, 'success');
    hideStepProgress();
  } else if (evt.type === 'error') {
    addLog(`错误: ${evt.message}`, 'error');
    setStatus('error', '错误');
    hideStepProgress();
  }
}

// ── 步骤进度条 ──────────────────────────────────────
const STEP_MAP = {
  'dataset': '加载数据', 'llm_pre': 'LLM 分析', 'train': '训练',
  'metric': '评估', 'llm_post': 'LLM 解读', 'done': '完成',
};

function showStepProgress(steps) {
  const el = document.getElementById('stepProgress');
  el.innerHTML = steps.map((s, i) =>
    `<span class="step-item" id="stepItem_${i}"><span class="step-dot" id="stepDot_${i}"></span>${s}</span>`
  ).join('');
  el.classList.add('show');
}

function updateStepProgress(step, status) {
  const stepName = STEP_MAP[step] || step;
  const items = document.querySelectorAll('.step-progress .step-item');
  items.forEach(item => {
    if (item.textContent.includes(stepName)) {
      const dot = item.querySelector('.step-dot');
      dot.className = `step-dot ${status}`;
    }
  });
}

function hideStepProgress() {
  // 保留显示，不隐藏
}

// ── 画布渲染 ────────────────────────────────────────
function clearCanvas() {
  document.getElementById('canvasInner').style.display = 'none';
  document.getElementById('emptyState').style.display = 'block';
  nodeData = { nodes: [], edges: [] };
}

function renderCanvas() {
  const inner = document.getElementById('canvasInner');
  const empty = document.getElementById('emptyState');
  if (!nodeData.nodes || nodeData.nodes.length === 0) {
    inner.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  inner.style.display = 'block';
  empty.style.display = 'none';

  // 清除旧节点
  inner.querySelectorAll('.node').forEach(n => n.remove());

  nodeData.nodes.forEach(node => {
    const el = document.createElement('div');
    el.className = `node status-${node.status}`;
    el.style.left = `${node.position.x}px`;
    el.style.top = `${node.position.y}px`;
    el.id = `node-${node.id}`;

    let bodyHTML = '';
    const d = node.display || {};
    switch (node.type) {
      case 'dataset':
        bodyHTML = `<div class="field"><span class="k">样本数</span><span class="v">${d.n_samples ?? '-'}</span></div>
                    <div class="field"><span class="k">特征数</span><span class="v">${d.n_features ?? '-'}</span></div>
                    <div class="field"><span class="k">任务类型</span><span class="v">${d.task_type ?? '-'}</span></div>`;
        if (d.feature_names && d.feature_names.length > 0) {
          bodyHTML += `<div class="tag-list">${d.feature_names.map(f => `<span class="tag">${escapeHTML(f)}</span>`).join('')}</div>`;
        }
        break;
      case 'model':
        bodyHTML = `<div class="field"><span class="k">模型</span><span class="v">${escapeHTML(d.model_name)}</span></div>`;
        if (d.params) {
          Object.entries(d.params).forEach(([k, v]) => {
            if (v !== null && v !== undefined && typeof v !== 'object') {
              bodyHTML += `<div class="field"><span class="k">${escapeHTML(k)}</span><span class="v">${escapeHTML(String(v))}</span></div>`;
            }
          });
        }
        if (d.search_info && d.search_info.enabled) {
          bodyHTML += `<div class="field"><span class="k">搜索得分</span><span class="v">${d.search_info.best_score?.toFixed(4)}</span></div>`;
        }
        break;
      case 'metric':
        Object.entries(d).forEach(([k, v]) => {
          if (k !== 'model_name' && typeof v === 'number') {
            bodyHTML += `<div class="field"><span class="k">${k}</span><span class="v">${v.toFixed(4)}</span></div>`;
          }
        });
        break;
      case 'llm_analysis':
        if (node.status === 'skipped') {
          bodyHTML = `<div class="skipped-text">已跳过</div>`;
        } else if (d.structured) {
          bodyHTML += `<div class="raw-text">${escapeHTML(JSON.stringify(d.structured, null, 2))}</div>`;
        } else if (d.content) {
          bodyHTML += `<div class="raw-text">${escapeHTML(d.content)}</div>`;
        } else {
          bodyHTML = `<div class="skipped-text">等待中...</div>`;
        }
        break;
      case 'comparison':
        if (d.models) {
          d.models.forEach(m => {
            const star = m.is_best ? '⭐' : '';
            bodyHTML += `<div class="field"><span class="k">${star} ${escapeHTML(m.model_name)}</span><span class="v">R²=${m.r2?.toFixed(4)}</span></div>`;
          });
        }
        break;
      case 'config':
        Object.entries(d).forEach(([k, v]) => {
          bodyHTML += `<div class="field"><span class="k">${escapeHTML(k)}</span><span class="v">${escapeHTML(String(v))}</span></div>`;
        });
        break;
    }

    el.innerHTML = `
      <div class="node-header">
        <span>${escapeHTML(node.label)}</span>
        <span class="node-badge badge-${node.status}">${node.status}</span>
      </div>
      <div class="node-body">${bodyHTML}</div>
    `;

    makeDraggable(el, node);
    inner.appendChild(el);
  });

  renderEdges();
}

function renderEdges() {
  const svg = document.getElementById('edgeLayer');
  const inner = document.getElementById('canvasInner');
  svg.innerHTML = '';
  svg.setAttribute('width', inner.scrollWidth);
  svg.setAttribute('height', inner.scrollHeight);

  if (!nodeData.edges) return;
  nodeData.edges.forEach(edge => {
    const src = document.getElementById(`node-${edge.source}`);
    const tgt = document.getElementById(`node-${edge.target}`);
    if (!src || !tgt) return;
    const x1 = src.offsetLeft + src.offsetWidth / 2;
    const y1 = src.offsetTop + src.offsetHeight;
    const x2 = tgt.offsetLeft + tgt.offsetWidth / 2;
    const y2 = tgt.offsetTop;
    const midY = (y1 + y2) / 2;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`);
    path.setAttribute('stroke', '#86868b');
    path.setAttribute('stroke-width', '1.5');
    path.setAttribute('fill', 'none');
    svg.appendChild(path);
  });
}

function makeDraggable(el, node) {
  let isDragging = false, startX, startY, origX, origY;
  el.addEventListener('mousedown', e => {
    isDragging = true; el.classList.add('dragging');
    startX = e.clientX; startY = e.clientY;
    origX = node.position.x; origY = node.position.y;
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!isDragging) return;
    node.position.x = origX + (e.clientX - startX);
    node.position.y = origY + (e.clientY - startY);
    el.style.left = `${node.position.x}px`;
    el.style.top = `${node.position.y}px`;
    renderEdges();
  });
  document.addEventListener('mouseup', () => {
    if (isDragging) { isDragging = false; el.classList.remove('dragging'); }
  });
}

// ── 工具函数 ────────────────────────────────────────
function resetLayout() {
  nodeData.nodes.forEach(n => {
    if (initialPositions[n.id]) n.position = { ...initialPositions[n.id] };
  });
  renderCanvas();
}

function downloadFile(filename, content, mimeType = 'application/json') {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadNodes() {
  if (!nodeData.nodes.length) { addLog('没有数据，请先运行', 'error'); return; }
  downloadFile(`nodes_${nodeData.run_id || 'export'}.json`, JSON.stringify({ run_id: nodeData.run_id, nodes: nodeData.nodes, edges: nodeData.edges }, null, 2));
  addLog('已下载 nodes.json', 'success');
}

function downloadResult() {
  if (!lastResult) { addLog('没有结果，请先运行', 'error'); return; }
  downloadFile(`result_${lastResult.run_id || 'export'}.json`, JSON.stringify(lastResult, null, 2));
  addLog('已下载完整结果', 'success');
}

function addLog(text, level = '') {
  const panel = document.getElementById('logPanel');
  const line = document.createElement('div');
  line.className = `log-line ${level}`;
  line.textContent = text;
  panel.appendChild(line);
  panel.scrollTop = panel.scrollHeight;
}

function clearLog() {
  document.getElementById('logPanel').innerHTML = '';
}

function setStatus(dotClass, text) {
  document.getElementById('statusDot').className = `status-dot ${dotClass}`;
  document.getElementById('statusText').textContent = text;
}

async function showHistory() {
  const res = await fetch('/api/history?limit=20');
  const data = await res.json();
  const body = document.getElementById('historyBody');
  body.innerHTML = '';
  if (data.runs.length === 0) {
    body.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-light);">暂无记录</td></tr>';
  } else {
    data.runs.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${r.run_id}</td><td>${r.dataset_name}</td><td>${r.best_model || '-'}</td><td>${r.timestamp}</td>`;
      body.appendChild(tr);
    });
  }
  document.getElementById('historyModal').classList.add('show');
}

function closeHistory() { document.getElementById('historyModal').classList.remove('show'); }

function escapeHTML(str) {
  const d = document.createElement('div');
  d.textContent = str ?? '';
  return d.innerHTML;
}

init();
</script>
</body>
</html>
