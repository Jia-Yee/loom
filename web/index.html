<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loom — AutoML 流程编辑器</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 顶栏 -->
<div class="topbar">
  <div class="logo">🌀 Loom</div>
  <div class="tab-switch">
    <button id="tabFlow" class="active" onclick="switchTab('flow')">流程编辑器</button>
    <button id="tabChat" onclick="switchTab('chat')">AI 对话</button>
    <button id="tabCode" onclick="switchTab('code')">代码</button>
  </div>
  <div class="spacer"></div>
  <div class="status-dot" id="statusDot"></div>
  <span id="statusText" style="font-size:0.8rem;color:var(--text-light);">就绪</span>
  <button class="btn" onclick="showLLMSettings()">⚙ LLM</button>
  <button class="btn" onclick="clearCanvas()">清空</button>
  <button class="btn" onclick="showHistory()">历史</button>
  <button class="btn btn-primary" id="btnRun" onclick="runFlow()">▶ 运行</button>
</div>

<!-- 主布局 -->
<div class="main" id="flowPanel" style="display:flex;">

  <!-- 左栏：节点库 -->
  <div class="sidebar-left">
    <div class="panel-header">节点库</div>
    <div class="search-box">
      <input type="text" placeholder="搜索节点..." oninput="filterNodes(this.value)">
    </div>
    <div class="node-list" id="nodeLibrary"></div>
  </div>

  <!-- 中间：画布 -->
  <div class="canvas-container" id="canvas">
    <div class="canvas-toolbar">
      <button onclick="resetLayout()">重置布局</button>
      <button onclick="autoLayout()">自动排列</button>
    </div>
    <div class="canvas-empty" id="canvasEmpty">
      <div class="icon">🌀</div>
      <div>从左侧拖拽节点到画布</div>
    </div>
    <svg class="edge-layer" id="edgeLayer">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#8888aa"/>
        </marker>
      </defs>
    </svg>
  </div>

  <!-- 右栏：参数配置 -->
  <div class="sidebar-right">
    <div class="panel-header" id="configTitle">参数配置</div>
    <div class="panel-content" id="configPanel">
      <div class="config-empty">点击画布上的节点查看参数</div>
    </div>
  </div>

</div>

<!-- 底栏：日志 -->
<div class="log-bar">
  <div class="log-header">
    📋 执行日志
    <button onclick="clearLog()">清空</button>
  </div>
  <div class="log-content" id="logPanel">
    <div class="log-line">Loom 流程编辑器已就绪。</div>
  </div>
</div>

<!-- LLM 设置弹窗 -->
<div id="llmModal" class="modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;">
  <div style="background:var(--surface);border-radius:12px;padding:24px;width:460px;max-width:90vw;">
    <div style="font-size:1.1rem;font-weight:600;margin-bottom:16px;">⚙ LLM 全局配置</div>
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div>
        <label style="font-size:0.8rem;color:var(--text-light);">Provider</label>
        <select id="llmProviderGlobal" style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;margin-top:4px;">
          <option value="">未配置（跳过 LLM）</option>
          <option value="ollama">Ollama（本地）</option>
          <option value="deepseek">DeepSeek</option>
        </select>
      </div>
      <div>
        <label style="font-size:0.8rem;color:var(--text-light);">API Key</label>
        <input id="llmApiKeyGlobal" type="password" placeholder="DeepSeek 需要；Ollama 填占位符" style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;margin-top:4px;">
      </div>
      <div>
        <label style="font-size:0.8rem;color:var(--text-light);">Base URL（留空用默认）</label>
        <input id="llmBaseUrlGlobal" type="text" placeholder="自动" style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;margin-top:4px;">
      </div>
      <div>
        <label style="font-size:0.8rem;color:var(--text-light);">模型名</label>
        <input id="llmModelGlobal" type="text" placeholder="如 qwen3.5:4b 或 deepseek-chat" style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;margin-top:4px;">
      </div>
      <div>
        <label style="font-size:0.8rem;color:var(--text-light);">超时（秒）</label>
        <input id="llmTimeoutGlobal" type="number" value="120" style="width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;margin-top:4px;">
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn" onclick="testLLMGlobal()" id="btnTestLLM">测试连接</button>
      <div style="flex:1;"></div>
      <button class="btn" onclick="closeLLMSettings()">取消</button>
      <button class="btn btn-primary" onclick="saveLLMSettings()">保存</button>
    </div>
    <div id="llmTestResult" style="margin-top:12px;font-size:0.85rem;"></div>
  </div>
</div>

<!-- AI 对话面板 -->
<div id="chatPanel" style="display:none;flex:1;flex-direction:column;overflow:hidden;">
  <div style="flex:1;overflow-y:auto;padding:16px;" id="chatMessages">
    <div style="text-align:center;color:var(--text-light);padding:40px;">AI 对话 — 可询问代码、模型、结果相关问题</div>
  </div>
  <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;background:var(--surface);">
    <textarea id="chatInput" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" rows="1" style="flex:1;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;resize:none;font-size:0.9rem;" onkeydown="onChatKey(event)" oninput="autoResize(this)"></textarea>
    <button class="btn btn-primary" onclick="sendChat()">发送</button>
  </div>
  <div style="padding:4px 16px 8px;display:flex;gap:8px;flex-wrap:wrap;background:var(--surface);border-top:1px solid var(--border);">
    <label style="font-size:0.8rem;color:var(--text-light);display:flex;align-items:center;gap:4px;"><input type="checkbox" id="chatIncludeCode"> 附带代码</label>
    <label style="font-size:0.8rem;color:var(--text-light);display:flex;align-items:center;gap:4px;"><input type="checkbox" id="chatIncludeResults"> 附带结果</label>
    <button class="btn" style="font-size:0.75rem;padding:2px 8px;" onclick="sendSuggestion('分析当前结果，给出改进建议')">分析结果</button>
    <button class="btn" style="font-size:0.75rem;padding:2px 8px;" onclick="sendSuggestion('推荐适合 diabetes 数据集的模型')">推荐模型</button>
  </div>
</div>

<!-- 代码面板 -->
<div id="codePanel" style="display:none;flex:1;flex-direction:row;overflow:hidden;">
  <div style="width:220px;border-right:1px solid var(--border);background:var(--surface);overflow-y:auto;padding:8px 0;">
    <div style="padding:8px 16px;font-weight:600;font-size:0.85rem;border-bottom:1px solid var(--border);">源码文件</div>
    <div id="fileList" style="padding:4px 0;"></div>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
    <div style="padding:8px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--surface);">
      <span id="codePath" style="font-family:monospace;font-size:0.8rem;color:var(--text-light);">选择文件</span>
      <div style="flex:1;"></div>
      <button class="btn" id="btnEditCode" onclick="editCode()" style="display:none;font-size:0.8rem;">编辑</button>
      <button class="btn" id="btnCancelCode" onclick="cancelEdit()" style="display:none;font-size:0.8rem;">取消</button>
      <button class="btn btn-primary" id="btnSaveCode" onclick="saveCode()" style="display:none;font-size:0.8rem;">保存</button>
      <span id="codeStatus" style="font-size:0.75rem;color:var(--text-light);"></span>
    </div>
    <div style="flex:1;overflow:auto;background:#1e1e2e;position:relative;">
      <pre id="codeContent" style="margin:0;padding:16px;font-family:'SF Mono','Fira Code',monospace;font-size:0.8rem;line-height:1.6;color:#cdd6f4;white-space:pre-wrap;word-break:break-all;"></pre>
      <textarea id="codeEditor" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;padding:16px;font-family:'SF Mono','Fira Code',monospace;font-size:0.8rem;line-height:1.6;background:#1e1e2e;color:#cdd6f4;border:none;outline:none;resize:none;" spellcheck="false"></textarea>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
