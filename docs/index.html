<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loom — 文档</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #faf8f5; --surface: #fff; --text: #2c2c2c; --text-light: #666;
    --accent: #4a7c59; --accent-light: #e8f0eb; --border: #e5e0d8;
    --code-bg: #f6f3ee; --radius: 10px; --shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.8;
    display: flex; height: 100vh; overflow: hidden;
  }
  /* 侧边栏 */
  .sidebar {
    width: 240px; background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .sidebar .logo {
    padding: 20px 24px; font-size: 1.2rem; font-weight: 700; color: var(--accent);
    border-bottom: 1px solid var(--border);
  }
  .sidebar nav { flex: 1; padding: 12px 0; overflow-y: auto; }
  .sidebar nav a {
    display: block; padding: 8px 24px; text-decoration: none; color: var(--text-light);
    font-size: 0.9rem; transition: all 0.15s; border-left: 3px solid transparent;
  }
  .sidebar nav a:hover { background: var(--accent-light); color: var(--text); }
  .sidebar nav a.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
  .sidebar .footer { padding: 12px 24px; font-size: 0.75rem; color: var(--text-light); border-top: 1px solid var(--border); }
  .sidebar .footer a { color: var(--accent); text-decoration: none; }

  /* 内容区 */
  .content { flex: 1; overflow-y: auto; padding: 48px 64px; }
  .markdown { max-width: 780px; }
  .markdown h1 { font-size: 1.8rem; margin: 0 0 16px; color: var(--text); }
  .markdown h2 { font-size: 1.3rem; margin: 32px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .markdown h3 { font-size: 1.1rem; margin: 24px 0 8px; }
  .markdown p { margin: 8px 0; }
  .markdown ul, .markdown ol { margin: 8px 0; padding-left: 24px; }
  .markdown li { margin: 4px 0; }
  .markdown code {
    background: var(--code-bg); padding: 2px 6px; border-radius: 4px;
    font-family: "SF Mono", "Fira Code", monospace; font-size: 0.85em;
  }
  .markdown pre {
    background: #1e1e2e; color: #cdd6f4; padding: 16px 20px; border-radius: 8px;
    overflow-x: auto; margin: 12px 0; font-size: 0.82rem; line-height: 1.6;
  }
  .markdown pre code { background: none; padding: 0; color: inherit; }
  .markdown table { border-collapse: collapse; width: 100%; margin: 12px 0; }
  .markdown th, .markdown td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  .markdown th { background: var(--accent-light); font-weight: 600; }
  .markdown tr:nth-child(even) { background: var(--bg); }
  .markdown blockquote {
    border-left: 4px solid var(--accent); padding: 8px 16px; margin: 12px 0;
    background: var(--accent-light); border-radius: 0 8px 8px 0;
  }
  .markdown a { color: var(--accent); }
  .markdown hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
  .loading { text-align: center; padding: 60px; color: var(--text-light); }
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo">🌀 Loom</div>
  <nav id="nav">
    <a href="#" data-md="overview" class="active">概览</a>
    <a href="#" data-md="models">模型</a>
    <a href="#" data-md="datasets">数据集</a>
    <a href="#" data-md="pipeline">流程</a>
    <a href="#" data-md="extension">扩展指南</a>
    <a href="#" data-md="api">API 文档</a>
  </nav>
  <div class="footer">
    <a href="https://github.com/Jia-Yee/loom">GitHub</a> · AGPL-3.0
  </div>
</div>

<div class="content">
  <div class="markdown" id="md"><div class="loading">加载中...</div></div>
</div>

<script>
const docs = {
  overview: 'markdown/overview.md',
  models: 'markdown/models.md',
  datasets: 'markdown/datasets.md',
  pipeline: 'markdown/pipeline.md',
  extension: 'markdown/extension.md',
  api: 'markdown/api.md',
};

async function loadDoc(name) {
  const md = document.getElementById('md');
  md.innerHTML = '<div class="loading">加载中...</div>';
  try {
    const res = await fetch(docs[name]);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    md.innerHTML = marked.parse(text);
  } catch (e) {
    md.innerHTML = `<div class="loading">加载失败: ${e.message}<br><br>提示：如果通过 GitHub Pages 访问，请确保 markdown/ 目录已推送。</div>`;
  }
  // 更新导航高亮
  document.querySelectorAll('#nav a').forEach(a => {
    a.classList.toggle('active', a.dataset.md === name);
  });
}

document.querySelectorAll('#nav a').forEach(a => {
  a.onclick = (e) => {
    e.preventDefault();
    loadDoc(a.dataset.md);
  };
});

// 启动
loadDoc('overview');
</script>

</body>
</html>
